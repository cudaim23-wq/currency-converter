<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chuyển đổi tiền tệ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
</head>
<body>
    <header class="nav-bar">
        <span class="logo">Đổi<span class="logo-accent">Tiền</span></span>
    </header>

    <main class="container">
        <section class="hero">
            <div class="hero-text">
                <h1>Đổi tiền nhanh, rõ ràng.</h1>
                <p class="lead">Quy đổi giữa 10 loại tiền tệ, xem bảng tỷ giá và lưu lại các cặp tiền bạn hay dùng.</p>
            </div>

            <div class="converter-card">
                <label class="field-label" for="amount">Số tiền</label>
                <input type="number" id="amount" class="text-input" placeholder="Nhập số tiền" min="0">

                <div class="currency-row">
                    <div class="currency-field">
                        <label class="field-label" for="from">Từ</label>
                        <select id="from" class="text-input">
                            <option value="USD" selected>USD</option>
                            <option value="EUR">EUR</option>
                            <option value="VND">VND</option>
                            <option value="JPY">JPY</option>
                            <option value="GBP">GBP</option>
                            <option value="AUD">AUD</option>
                            <option value="CAD">CAD</option>
                            <option value="CNY">CNY</option>
                            <option value="KRW">KRW</option>
                            <option value="SGD">SGD</option>
                        </select>
                    </div>

                    <button id="swap-btn" class="btn-icon" title="Hoán đổi" aria-label="Hoán đổi tiền nguồn và tiền đích">⇄</button>

                    <div class="currency-field">
                        <label class="field-label" for="to">Sang</label>
                        <select id="to" class="text-input">
                            <option value="USD">USD</option>
                            <option value="EUR">EUR</option>
                            <option value="VND" selected>VND</option>
                            <option value="JPY">JPY</option>
                            <option value="GBP">GBP</option>
                            <option value="AUD">AUD</option>
                            <option value="CAD">CAD</option>
                            <option value="CNY">CNY</option>
                            <option value="KRW">KRW</option>
                            <option value="SGD">SGD</option>
                        </select>
                    </div>
                </div>

                <p id="result" class="result"></p>
                <p id="status" class="status" role="status"></p>

                <div class="actions">
                    <button id="convert-btn" class="btn btn-primary">Đổi</button>
                    <button id="favorite-btn" class="btn btn-secondary">Lưu cặp yêu thích</button>
                </div>

                <p id="updated-at" class="caption"></p>
            </div>
        </section>

        <section class="content">
            <div class="card card-wide">
                <h2>Bảng quy đổi từ 1 <span id="table-base">USD</span></h2>
                <table id="rate-table" class="rate-table">
                    <thead>
                        <tr>
                            <th>Tiền tệ</th>
                            <th>Giá trị</th>
                        </tr>
                    </thead>
                    <tbody id="rate-table-body"></tbody>
                </table>
            </div>

            <div class="card">
                <h2>Cặp yêu thích</h2>
                <ul id="favorite-list" class="list"></ul>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2>Lịch sử quy đổi</h2>
                    <button id="clear-history-btn" class="btn btn-tertiary btn-sm">Xóa lịch sử</button>
                </div>
                <ul id="history-list" class="list"></ul>
            </div>
        </section>
    </main>

    <footer class="footer">
        WEB2064 · Lập trình JavaScript nâng cao · Tỷ giá: open.er-api.com
    </footer>
</body>
</html>
